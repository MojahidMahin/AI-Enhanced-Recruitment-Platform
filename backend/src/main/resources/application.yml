spring:
  application:
    name: AI Recruitment Platform

  datasource:
    url: jdbc:postgresql://localhost:5432/recruitment_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.recruitment: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: your-secret-key-change-this-in-production-with-strong-key
  expiration: 86400000

openai:
  api:
    key: ${OPENAI_API_KEY:your-openai-api-key}
    model: gpt-3.5-turbo
